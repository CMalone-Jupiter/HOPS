[project]
name = "hops"
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12.0"

[dependencies]
python = "3.12.*"

# GPU-enabled PyTorch from conda-forge
pytorch-gpu = "*"
torchvision = "*"
pytorch-lightning = "*"
torchmetrics = "*"
pytorch-metric-learning = "*"
einops = "*"

# CUDA toolchain (compiler meta-package) from conda-forge
cuda-compiler = "*"

# Core stack
numpy = "*"
scipy = "*"
pandas = "*"
matplotlib = "*"
seaborn = "*"
statsmodels = "*"
scikit-learn = "*"
opencv = "*"
scikit-image = "*"
pillow = "*"
imageio = "*"
tifffile = "*"
albumentations = "*"

faiss-cpu = "*"
tqdm = "*"
requests = "*"
pyyaml = "*"
loguru = "*"
gdown = "*"
huggingface_hub = "*"
kagglehub = "*"